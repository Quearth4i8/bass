<!-- The shell itself never scrolls: the fixed nav sits on top and `.portal-scroll`
     below it is the page's scroll container, so the scrollbar starts under the
     header instead of running the full viewport height beside it. -->
<!-- --portal-accent is the landing palette teal for every project (set in the
     stylesheet); bind portalAccentHex here again to bring back per-project colours. -->
<div class="portal-shell"
     [style.--portal-nav-h]="portalNavHeightPx">

  <!-- Nothing themed renders until the project is known: --portal-accent is
       still its fallback while the lookup is in flight, so painting the nav and
       pages now would show every portal in the default teal and then repaint it
       in its own colour. This screen is neutral on purpose. -->
  <div class="portal-boot" *ngIf="booting">
    <div class="portal-boot-spinner"></div>
  </div>

  <ng-container *ngIf="!booting">
    <app-navbar2 [forceLegacyNav]="notFound"></app-navbar2>

    <div class="portal-scroll" #portalScroll>
      <div class="portal-content">
        <ng-container *ngIf="!notFound; else notFoundTpl">
          <router-outlet></router-outlet>
        </ng-container>

        <ng-template #notFoundTpl>
          <div class="not-found-container">
            <div class="not-found-box">
              <i class='bx bx-search-alt'></i>
              <h1>Project Not Found</h1>
              <p>The project you're looking for doesn't exist or has been removed.</p>
              <button class="back-home-btn" (click)="goBack()">
                <i class='bx bx-home'></i> Back to Projects
              </button>
            </div>
          </div>
        </ng-template>
      </div>

      <app-footer></app-footer>
    </div>

  </ng-container>
</div>
