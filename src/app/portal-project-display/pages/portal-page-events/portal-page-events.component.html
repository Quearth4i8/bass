<div *ngIf="loading" class="page-loader"><div class="spinner"></div></div>

<ng-container *ngIf="!loading && project">
  <div class="page-header">
    <h2 class="page-section-title">Events</h2>
    <div class="header-divider"></div>
  </div>

  <div class="events-container" *ngIf="project.content.events.events?.length">
    <div class="event-card" *ngFor="let event of project.content.events.events">
      <div class="event-date-col">
        <span class="event-day">{{ getEventDay(event.date) }}</span>
        <span class="event-full-date">{{ formatEventDate(event.date) }}</span>
        <span class="event-time">{{ event.timeFrom }} – {{ event.timeTo }}</span>
      </div>
      <div class="event-body">
        <div class="event-top">
          <h3 class="event-title">{{ event.title }}</h3>
          <span class="event-status" [ngClass]="getStatusClass(event.status)">
            {{ event.status | titlecase }}
          </span>
        </div>
        <p class="event-location"><i class='bx bx-map-pin'></i> {{ event.location }}</p>
        <p class="event-description">{{ event.description }}</p>
      </div>
    </div>
  </div>

  <div class="empty-state" *ngIf="!project.content.events.events?.length">
    <i class='bx bx-calendar-x'></i>
    <p>There is no data.</p>
  </div>
</ng-container>
