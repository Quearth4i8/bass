<div *ngIf="loading" class="page-loader"><div class="spinner"></div></div>

<ng-container *ngIf="!loading && project">
  <app-portal-page-hero title="Objectives"></app-portal-page-hero>

  <div class="content-container" *ngIf="nonEmptyParagraphs(project.content.objectives.paragraphs).length">
    <div
      class="rich-paragraph"
      *ngFor="let para of nonEmptyParagraphs(project.content.objectives.paragraphs)"
      [innerHTML]="para.content | safeHtml"
    ></div>
  </div>

  <div class="empty-state" *ngIf="!nonEmptyParagraphs(project.content.objectives.paragraphs).length">
    <i class='bx bx-target-lock'></i>
    <p>There is no data.</p>
  </div>
</ng-container>
