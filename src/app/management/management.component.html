<div class="admin-layout">
  <!-- Header -->
  <header class="admin-header">
    <div class="header-left">
      <button class="menu-toggle" (click)="toggleSidebar()">
        <i class='bx bx-menu'></i>
      </button>
      <h1 class="page-title">Management</h1>
    </div>
    <div class="header-right">
      <button class="header-btn primary" (click)="showAddProjectDialog()">
        <i class='bx bx-plus'></i>
        <span>Add New Portal Project</span>
      </button>
      <div class="user-menu">
        <div class="user-avatar" (click)="toggleUserMenu()">
          <i class='bx bx-user'></i>
        </div>
        <div class="dropdown-menu" [class.show]="isUserMenuOpen">
          <div class="dropdown-item" (click)="showLogoutModal($event)">
            <i class='bx bx-log-out'></i>
            <span>Logout</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="admin-sidebar" [class.collapsed]="!isSidebarVisible">
    <nav class="sidebar-nav">
      <a routerLink="/projectadmin" class="nav-item">
        <i class='bx bx-home'></i>
        <span>Projects</span>
      </a>
      <a routerLink="/docsadmin" class="nav-item">
        <i class='bx bx-file'></i>
        <span>Documents</span>
      </a>
      <a routerLink="/budget-charts" class="nav-item">
        <i class='bx bx-pie-chart-alt-2'></i>
        <span>Budget Charts</span>
      </a>
      <a routerLink="/eventsadmin" class="nav-item">
        <i class='bx bx-calendar-event'></i>
        <span>Events</span>
      </a>
      <a routerLink="/management" class="nav-item active">
        <i class='bx bx-cog'></i>
        <span>Management</span>
      </a>
    </nav>
  </aside>

  <main class="admin-main" [class.sidebar-open]="isSidebarVisible">
    <!-- Stats Cards -->
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-icon purple">
          <i class='bx bx-grid-alt'></i>
        </div>
        <div class="stat-info">
          <h2>{{ portalProjects.length }}</h2>
          <p>Portal Projects</p>
        </div>
      </div>
      <div class="stat-box">
        <div class="stat-icon green">
          <i class='bx bx-check-circle'></i>
        </div>
        <div class="stat-info">
          <h2>2</h2>
          <p>Active Projects</p>
        </div>
      </div>
      <div class="stat-box">
        <div class="stat-icon orange">
          <i class='bx bx-time-five'></i>
        </div>
        <div class="stat-info">
          <h2>0</h2>
          <p>Pending Actions</p>
        </div>
      </div>
    </div>

    <!-- Breadcrumb below cards -->
    <div class="breadcrumb-container">
      <div class="breadcrumb">
        <span>Management</span>
      </div>
    </div>

    <div class="content-wrapper">
      <div class="portal-grid">
        <div class="portal-card" *ngFor="let project of portalProjects">
          <div class="card-image-wrapper">
            <img [src]="project.image" [alt]="project.title" class="card-img">
            <div class="coming-soon-badge" *ngIf="project.comingSoon">
              <span>COMING SOON</span>
            </div>
            <div class="card-overlay" *ngIf="project.comingSoon"></div>
          </div>
          <div class="card-content">
            <h3 class="card-title">{{ project.title }}</h3>
            <p class="card-subtitle">{{ project.description }}</p>
            <div class="card-actions">
              <button class="btn-platform" [class.disabled]="project.comingSoon" (click)="!project.comingSoon && goToPortalProjects(project.title)">
                ENTER PLATFORM
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Logout Confirmation Modal -->
  <div class="modal-overlay" *ngIf="logoutModalVisible" (mousedown)="onOverlayClick($event)">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <i class='bx bx-log-out-circle'></i>
          <h3>Confirm Logout</h3>
        </div>
        <div class="modal-body">
          <p>Are you sure you want to logout?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-cancel" (click)="closeLogoutModal()">Cancel</button>
          <button type="button" class="btn-confirm" (click)="confirmLogout()">Logout</button>
        </div>
      </div>
    </div>
  </div>
</div>
