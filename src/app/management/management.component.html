<div class="admin-layout">
  <!-- Header -->
  <header class="admin-header">
    <div class="header-left">
      <button class="menu-toggle" (click)="toggleSidebar()">
        <i class='bx bx-menu'></i>
      </button>
      <h1 class="page-title">Management</h1>
    </div>
    <div class="header-right">
      <div class="user-menu">
        <div class="user-avatar" (click)="toggleUserMenu()">
          <i class='bx bx-user'></i>
        </div>
        <div class="dropdown-menu" [class.show]="isUserMenuOpen">
          <div class="dropdown-item" (click)="showLogoutModal($event)">
            <i class='bx bx-log-out'></i>
            <span>Logout</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="admin-sidebar" [class.collapsed]="!isSidebarVisible">
    <nav class="sidebar-nav">
      <a routerLink="/projectadmin" class="nav-item">
        <i class='bx bx-home'></i>
        <span>Projects</span>
      </a>
      <a routerLink="/docsadmin" class="nav-item">
        <i class='bx bx-file'></i>
        <span>Documents</span>
      </a>
      <a routerLink="/budget-charts" class="nav-item">
        <i class='bx bx-pie-chart-alt-2'></i>
        <span>Budget Charts</span>
      </a>
      <a routerLink="/eventsadmin" class="nav-item">
        <i class='bx bx-calendar-event'></i>
        <span>Events</span>
      </a>
      <a routerLink="/management" class="nav-item active">
        <i class='bx bx-cog'></i>
        <span>Management</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="admin-main" [class.sidebar-open]="isSidebarVisible">
    <div class="content-wrapper">
      <div class="management-container">
        <p>management works!</p>
      </div>
    </div>
  </main>

  <!-- Logout Confirmation Modal -->
  <div class="modal-overlay" *ngIf="logoutModalVisible" (mousedown)="onOverlayClick($event)">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <i class='bx bx-log-out-circle'></i>
          <h3>Confirm Logout</h3>
        </div>
        <div class="modal-body">
          <p>Are you sure you want to logout?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-cancel" (click)="closeLogoutModal()">Cancel</button>
          <button type="button" class="btn-confirm" (click)="confirmLogout()">Logout</button>
        </div>
      </div>
    </div>
  </div>
</div>
