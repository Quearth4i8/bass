<div class="lc-grid">
  <article
    *ngFor="let card of cards"
    class="lc-card"
    [class.lc-expanded]="activeCard === card.id"
    (click)="toggle(card.id)">

    <img [src]="card.image" [alt]="card.name" class="lc-img">
    <div class="lc-hatch"></div>

    <!-- Slide-up description panel -->
    <div class="lc-overlay">
      <p>{{ card.description }}</p>
    </div>

    <!-- Bottom bar -->
    <div class="lc-foot">
      <div class="lc-info">
        <span class="lc-tag">{{ card.tag }}</span>
        <span class="lc-name">{{ card.name }}</span>
      </div>
      <span class="lc-toggle-icon">{{ activeCard === card.id ? '×' : '+' }}</span>
    </div>

  </article>
</div>
