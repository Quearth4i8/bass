
<div class="hero-container">
    <app-navbar></app-navbar>
    <carousel></carousel>
    <div class="hero-gradient"></div>
</div>

<section class="body">
    <div class="logo-strip">
        <img src="assets/images/Tunisia.gif" loading="lazy" decoding="async" class="logo logo--primary">
        <img src="assets/images/LOGOAG.png" loading="lazy" decoding="async" class="logo">
        <img src="assets/images/LOGOIRESA.png" loading="lazy" decoding="async" class="logo">
        <img src="assets/images/LOGOINSTM.png" loading="lazy" decoding="async" class="logo">
        <img src="assets/images/LOGONAS.png" loading="lazy" decoding="async" class="logo">
        <img src="assets/images/LOGOUSAID.png" loading="lazy" decoding="async" class="logo">
    </div>

    <div class="video-background-container">
        <video class="background-video" video autoplay loop muted playsinline preload="metadata">
            <source src="assets/videos/bg-ocean.mp4" type="video/mp4">
        </video>
        <div class="video-container">
            <video controls preload="metadata" class="observe-video">
                <source src="assets/videos/1.mp4" type="video/mp4">
            </video>
        </div>
    </div>
</section>



<div class="container2" *ngFor="let item of contentItems; let i = index">
    <div class="content-wrapper" #contentWrapper>
        <section [class]="i % 2 === 0 ? 'text-section-left fade-in-left' : 'text-section-right fade-in-right'"
            [style.order]="i % 2 === 0 ? 1 : 2">
            <h1>{{ item.title }}</h1>
            <h5>{{ item.description }}</h5>
        </section>
        <img src="{{ item.image }}" alt="Image Description" class="image"
            [ngClass]="i % 2 === 0 ? 'fade-in-right' : 'fade-in-left'" [style.order]="i % 2 === 0 ? 2 : 1" />
    </div>
</div>

<app-upbutton></app-upbutton>

<app-footer></app-footer>
