<ng-container *ngIf="portalMode; else legacyNavbar">
  <header class="portal-shell-nav" [ngClass]="{'sticky': isSticky}">
    <div class="logo-section">
      <a [routerLink]="portalLink('home')" class="logo">{{ portalTitle }}</a>
    </div>

    <nav class="portal-nav-center" aria-label="Project sections">
      <ul>
        <li *ngFor="let link of portalTopNavLinks">
          <a
            [routerLink]="portalLink(link.path)"
            routerLinkActive="nav-active"
            [routerLinkActiveOptions]="{ exact: link.path === 'home' }"
          >
            {{ link.label }}
          </a>
        </li>
      </ul>
    </nav>

    <div class="portal-nav-actions">
      <app-custom-button></app-custom-button>
    </div>
  </header>
</ng-container>

<ng-template #legacyNavbar>
  <header [ngClass]="{'sticky': isSticky}">
    <div class="logo-section">
      <a routerLink="/" class="logo">BASSIANA</a>
    </div>

    <button class="hamburger" type="button" aria-label="Toggle navigation" (click)="toggleMenu()">
      <span></span><span></span><span></span>
    </button>

    <ul [ngClass]="{'open': isMenuOpen}">
      <li><a routerLink="/projects">Projects</a></li>
    </ul>
    <app-custom-button></app-custom-button>
  </header>
</ng-template>
