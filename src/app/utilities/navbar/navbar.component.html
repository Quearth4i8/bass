<header [ngClass]="{'sticky': isSticky}">
    <div class="logo-section">
        <a *ngIf="isHomePage" routerLink="/" class="projects-icon" title="Projects">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
        </a>
        <a routerLink="/imas-ichkeul" class="logo">IMAS-ICHKEUL</a>
    </div>
    
    <button class="hamburger" type="button" aria-label="Toggle navigation" (click)="toggleMenu()">
      <span></span><span></span><span></span>
    </button>
  
  <ul [ngClass]="{'open': isMenuOpen}">
    <li><a routerLink="/imas-ichkeul">Home</a></li>
    <li class="dropdown" [ngClass]="{'open': openDropdown==='imas'}">
      <a routerLink="#" class="dropdown-toggle" (click)="toggleDropdown('imas', $event)">
        IMAS-Ichkeul
        <span><img src="assets/images/down.png" class="icon" style="width: 20px; height: 20px;"></span>
      </a>
      <ul class="dropdown-menu" style=" padding: 10px;" [ngClass]="{'show': openDropdown==='imas'}">
        <li style="padding: 5px 5px;"><a routerLink="/ichkeul">Scientific merit</a></li>
        <li style="padding: 5px 5px;"><a routerLink="/objectives">Objectives</a></li>
        <li style="padding: 5px 5px;"><a routerLink="/partners">Partners &amp; Funder</a></li>
      </ul>
    </li>
    <li><a routerLink="/gallery">Gallery</a></li>
    <li><a routerLink="/events">Events</a></li>
    <li><a routerLink="/team">Team</a></li>
    <li><a routerLink="/dataproviders">Data Providers</a></li>
  </ul>
  <app-custom-button></app-custom-button>
</header>
