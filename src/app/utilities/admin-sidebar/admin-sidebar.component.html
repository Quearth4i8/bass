<aside class="admin-sidebar" [class.collapsed]="collapsed">
  <nav class="sidebar-nav">
    <a routerLink="/projectadmin" class="nav-item"
       routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
      <i class='bx bx-home'></i>
      <span>Projects</span>
    </a>
    <a routerLink="/shared-folder" class="nav-item"
       routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
      <i class='bx bx-folder-open'></i>
      <span>Shared Folder</span>
    </a>
    <a routerLink="/budget-charts" class="nav-item"
       routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
      <i class='bx bx-pie-chart-alt-2'></i>
      <span>Budget Charts</span>
    </a>
    <!-- Not exact: a project's editor (/management/portal-projects/:slug) is
         still part of Management. -->
    <a routerLink="/management" class="nav-item"
       routerLinkActive="active" [routerLinkActiveOptions]="{exact:false}">
      <i class='bx bx-cog'></i>
      <span>Management</span>
    </a>
    <a routerLink="/wikiadmin" class="nav-item"
       routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
      <i class='bx bx-book-open'></i>
      <span>Wikiadmin</span>
    </a>
  </nav>
</aside>
