<div class="modern-sidebar" [class.collapsed]="!isSidebarVisible">
  <!-- Sidebar Header -->
  <div class="sidebar-header">
    <div class="logo-section" *ngIf="isSidebarVisible">
      <div class="logo-icon">
        <img src="assets/INSTM_logo.png" alt="Logo" class="logo-img">
      </div>
      <div class="logo-text">
        <h3>BASSIANA</h3>
        <span>Admin Panel</span>
      </div>
    </div>
    <div class="logo-section collapsed" *ngIf="!isSidebarVisible">
      <button class="toggle-btn-center" (click)="toggleSidebar()" [title]="isSidebarVisible ? 'Collapse Sidebar' : 'Expand Sidebar'">
        <span class="toggle-icon">{{ isSidebarVisible ? '◀' : '▶' }}</span>
      </button>
    </div>
    <button class="toggle-btn" *ngIf="isSidebarVisible" (click)="toggleSidebar()" [title]="isSidebarVisible ? 'Collapse Sidebar' : 'Expand Sidebar'">
      <span class="toggle-icon">{{ isSidebarVisible ? '◀' : '▶' }}</span>
    </button>
  </div>

  <!-- Navigation Menu -->
  <nav class="sidebar-nav">
    <ul class="nav-list">
      <!-- Home -->
      <li class="nav-item">
        <a routerLink="/" class="nav-link" [class.active]="isActiveRoute('')">
          <div class="nav-icon">
            <span class="icon">🏠</span>
          </div>
          <span class="nav-text" *ngIf="isSidebarVisible">Home</span>
          <!-- No nav-indicator for home -->
        </a>
      </li>

      <!-- Projects -->
      <li class="nav-item">
        <a routerLink="/projectadmin" class="nav-link" [class.active]="isActiveRoute('projectadmin')">
          <div class="nav-icon">
            <span class="icon">📊</span>
          </div>
          <span class="nav-text" *ngIf="isSidebarVisible">Projects</span>
          <div class="nav-indicator" *ngIf="isActiveRoute('projectadmin')"></div>
        </a>
      </li>

      <!-- Documents -->
      <li class="nav-item">
        <a routerLink="/docsadmin" class="nav-link" [class.active]="isActiveRoute('docsadmin')">
          <div class="nav-icon">
            <span class="icon">📁</span>
          </div>
          <span class="nav-text" *ngIf="isSidebarVisible">Docs</span>
          <div class="nav-indicator" *ngIf="isActiveRoute('docsadmin')"></div>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Sidebar Footer -->
  <div class="sidebar-footer" *ngIf="isSidebarVisible">
    <div class="user-info">
      <div class="user-avatar">
        <span class="avatar-icon">👤</span>
      </div>
      <div class="user-details">
        <div class="user-name">Admin User</div>
        <div class="user-role">Administrator</div>
      </div>
    </div>
    <div class="footer-actions">
      <button class="footer-btn" title="Logout">
        <span class="icon">🚪</span>
      </button>
    </div>
  </div>

  <!-- Collapsed Footer -->
  <div class="sidebar-footer collapsed" *ngIf="!isSidebarVisible">
    <button class="footer-btn" title="Logout">
      <span class="icon">🚪</span>
    </button>
  </div>
</div>

<!-- Overlay for mobile -->
<div class="sidebar-overlay" 
     *ngIf="isSidebarVisible && isMobile" 
     (click)="toggleSidebar()"></div>
