<div class="custom-dialog">
  <h1 class="dialog-title">
    Delete Project
  </h1>
  <div>
    <p>Are you sure you want to delete this project?</p>
  </div>
  <div class="btns">
    <button mat-button color="primary" class="dialog-button" (click)="onCancel()">
      <img src="assets/icons/close.png" style="width: 18px;">
      Cancel
    </button>
    <button mat-button color="warn" class="dialog-button" (click)="onConfirm()">
      <img src="assets/icons/save.png" style="width: 20px;">
      Confirm
    </button>
  </div>
</div>
