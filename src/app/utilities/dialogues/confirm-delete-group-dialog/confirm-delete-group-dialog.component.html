<div class="custom-dialog">
    <h2 class="dialog-title">
        Are you sure you want to delete this project group?
    </h2>
    <div mat-dialog-actions class="btns">
      <button mat-button color="primary" (click)="onCancel()">
        <img src="assets/icons/close.png" style="width: 18px;">
        Cancel
      </button>
      <button mat-button color="warn" (click)="onConfirm()">
        <img src="assets/icons/save.png" style="width: 20px;">
        Confirm
      </button>
    </div>
  </div>
