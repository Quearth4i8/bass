<header class="admin-header">
  <div class="header-left">
    <button class="menu-toggle" (click)="onMenuToggle()">
      <i class='bx bx-menu'></i>
    </button>

    <!-- Named slot for dynamic breadcrumb titles (e.g. docsadmin) -->
    <ng-content select="[header-title]"></ng-content>

    <!-- Fallback simple title -->
    <h1 class="page-title" *ngIf="pageTitle">{{ pageTitle }}</h1>
  </div>

  <div class="header-right">
    <!-- Page-specific action buttons go here -->
    <ng-content select="[header-actions]"></ng-content>

    <!-- Portal home icon -->
    <a routerLink="/" class="icon-btn" title="BASSIANA Database Portal">
      <i class='bx bx-home-alt-2'></i>
    </a>

    <button class="theme-btn" (click)="themeService.toggle()"
      [title]="themeService.isLight ? 'Switch to dark' : 'Switch to light'">
      <i class='bx' [class.bx-sun]="!themeService.isLight" [class.bx-moon]="themeService.isLight"></i>
    </button>

    <div class="user-menu">
      <div class="user-avatar" (click)="toggleUserMenu()">
        <i class='bx bx-user'></i>
      </div>
      <div class="dropdown-menu" [class.show]="isUserMenuOpen">
        <div class="dropdown-item logout" (click)="showLogoutModal($event)">
          <i class='bx bx-log-out'></i>
          <span>Logout</span>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Logout confirmation modal -->
<div class="modal-overlay" *ngIf="logoutModalVisible" (mousedown)="onOverlayClick($event)">
  <div class="modal-dialog" (mousedown)="$event.stopPropagation()">
    <div class="modal-content">
      <div class="modal-header">
        <i class='bx bx-log-out-circle'></i>
        <h3>Confirm Logout</h3>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to logout?</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-cancel" (click)="closeLogoutModal()">Cancel</button>
        <button type="button" class="btn-confirm danger" (click)="confirmLogout()">Logout</button>
      </div>
    </div>
  </div>
</div>
