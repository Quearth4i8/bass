<div class="landing-container">

  <!-- Nav -->
  <nav class="nav">
    <div class="nav-inner">
      <div class="brand">
        <img class="brand-mark" src="assets/logo/logo.png" alt="Bassiana logo">
        <div>
          <div class="brand-name">BASSIANA</div>
          <div class="brand-sub">Marine Ecosystems DB</div>
        </div>
      </div>

      <div class="nav-links">
        <button class="nav-link" routerLink="/home" routerLinkActive="active">Home</button>
        <button class="nav-link" routerLink="/index" routerLinkActive="active">Index</button>
        <button class="nav-link" routerLink="/portals" routerLinkActive="active">Portal Projects</button>
        <button class="nav-link" routerLink="/team" routerLinkActive="active">Team</button>
        <button class="nav-link" routerLink="/outputs" routerLinkActive="active">Relevant Outputs</button>
      </div>

      <div class="nav-meta">
        <span class="nav-clock">{{ currentTime }}</span>

        <button class="theme-btn" (click)="themeService.toggle()" [title]="themeService.isLight ? 'Switch to dark' : 'Switch to light'">
          <i class='bx' [class.bx-sun]="!themeService.isLight" [class.bx-moon]="themeService.isLight"></i>
        </button>

        <div class="admin-area">
          <button class="admin-btn" (click)="toggleAdminLogin()" title="Admin">
            <i class='bx bx-lock-open-alt'></i>
          </button>

          <div class="admin-dropdown" *ngIf="showAdminLogin" (click)="$event.stopPropagation()">
            <ng-container *ngIf="isAdminLoggedIn; else loginForm">
              <div class="admin-compact">
                <h3>Admin</h3>
                <button type="button" class="dropdown-btn" (click)="continueToAdmin()">Continue</button>
                <button type="button" class="dropdown-btn logout-btn" (click)="adminLogout()">Logout</button>
              </div>
            </ng-container>
            <ng-template #loginForm>
              <form (submit)="login($event)">
                <h3>Admin Login</h3>
                <div class="dropdown-input">
                  <input type="text" placeholder="Username" required [(ngModel)]="username" name="landing-admin-username">
                  <i class='bx bxs-user'></i>
                </div>
                <div class="dropdown-input">
                  <input [type]="showPassword ? 'text' : 'password'" placeholder="Password" required [(ngModel)]="password" name="landing-admin-password">
                  <i class='bx' [class.bx-show]="!showPassword" [class.bx-hide]="showPassword" (click)="togglePasswordVisibility()" style="cursor: pointer;"></i>
                </div>
                <button type="submit" class="dropdown-btn">Login</button>
                <div *ngIf="error" class="dropdown-error">{{ error }}</div>
              </form>
            </ng-template>
          </div>
        </div>

        <a href="http://41.229.139.17:8080/imas/login" target="_blank" rel="noopener noreferrer"
           class="btn btn-primary nav-db-btn" title="Open the BASSIANA database">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="5" rx="9" ry="3"/>
            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
          </svg>
          <span>BASSIANA DB</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Page content -->
  <div class="shell">
    <router-outlet></router-outlet>
  </div>

  <footer class="landing-footer">
    <div class="shell footer-inner">
      <span>© {{ currentYear }} BASSIANA · INSTM</span>
      <span>made for marine research</span>
    </div>
  </footer>

</div>
