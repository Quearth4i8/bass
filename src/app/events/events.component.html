<div class="events-container">
    <div class="events-header">
        <h1 class="events-title">IMAS-ICHKEUL</h1>
        <h2 class="events-subtitle">Events Timeline</h2>
        <div class="timeline-line"></div>
    </div>

    <div class="events-grid">
        <div class="events-column" *ngFor="let column of eventsColumns; let colIndex = index">
            <div class="event-card" *ngFor="let event of column; let i = index" [class.expanded]="expandedEvents[getEventIndex(colIndex, i)]">
                <div class="event-header" (click)="toggleEvent(getEventIndex(colIndex, i))">
                    <div class="event-date">
                        <div class="date-day">{{ event.date }}</div>
                        <div class="date-month">{{ event.month }}</div>
                        <div class="date-year">{{ event.year }}</div>
                    </div>
                    
                    <div class="event-title-row">
                        <h3 class="event-title">{{ event.title }}</h3>
                        <div class="event-type-indicator" [style.background-color]="event.color"></div>
                    </div>
                    
                    <div class="expand-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                </div>
                
                <div class="event-content" [@slideToggle]="expandedEvents[getEventIndex(colIndex, i)] ? 'expanded' : 'collapsed'">
                    <div class="event-meta">
                        <div class="meta-item">
                            <svg class="meta-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M8 2v5M16 2v5M3.5 9.09h17M21 8.5V17a2 2 0 01-2 2H5a2 2 0 01-2-2V8.5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <span>{{ event.day }}</span>
                        </div>
                        <div class="meta-item">
                            <svg class="meta-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                                <path d="M12 6v6l4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <span>{{ event.time }}</span>
                        </div>
                        <div class="meta-item">
                            <svg class="meta-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="12" cy="10" r="3" stroke="currentColor" stroke-width="2"/>
                            </svg>
                            <span>{{ event.location }}</span>
                        </div>
                    </div>
                    
                    <p class="event-description">{{ event.description }}</p>
                    
                    <div class="event-footer">
                        <span class="event-type" [style.background-color]="event.color + '20'" [style.color]="event.color">
                            {{ event.type.toUpperCase() }}
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<app-upbutton></app-upbutton>
<app-footer></app-footer>
