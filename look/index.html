<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>BASSIANA · Marine Ecosystems Portal</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg:        #031420;
    --bg-2:      #061f2e;
    --panel:     #082a3d;
    --panel-2:   #0a3142;
    --line:      #103a4f;
    --line-2:    #1b5573;
    --text:      #e8f1f5;
    --text-dim:  #9fb3bf;
    --text-faint:#5d7785;
    --accent:    #4ad6c4;
    --accent-2:  #2a8b9c;
    --warn:      #f5b94a;
    --good:      #4ad6c4;

    --font-sans: 'Geist', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --font-display: 'Geist', system-ui, sans-serif;

    --pad: 24px;
    --pad-card: 22px;
    --radius: 10px;
    --radius-sm: 6px;

    /* density-driven */
    --row-h: 56px;
    --card-pad: 22px;
    --section-gap: 80px;
  }

  [data-density="compact"] {
    --row-h: 44px;
    --card-pad: 16px;
    --section-gap: 56px;
  }
  [data-density="comfortable"] {
    --row-h: 64px;
    --card-pad: 28px;
    --section-gap: 104px;
  }

  [data-font="geist"]   { --font-sans:'Geist',sans-serif;          --font-mono:'JetBrains Mono',monospace;  --font-display:'Geist',sans-serif; }
  [data-font="manrope"] { --font-sans:'Manrope',sans-serif;        --font-mono:'Space Mono',monospace;      --font-display:'Manrope',sans-serif; }
  [data-font="editorial"]{ --font-sans:'Geist',sans-serif;         --font-mono:'IBM Plex Mono',monospace;   --font-display:'Instrument Serif',serif; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  body {
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(74,214,196,0.06), transparent 60%),
      radial-gradient(900px 500px at 10% 40%, rgba(27,85,115,0.18), transparent 60%),
      var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  ::selection { background: var(--accent); color: var(--bg); }

  .mono { font-family: var(--font-mono); letter-spacing: 0.02em; }
  .label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-faint); }
  .label-accent { color: var(--accent); }

  /* ── Layout grid ─────────────────────────────────────────────────────── */
  .shell { max-width: 1480px; margin: 0 auto; padding: 0 32px; }
  .grid-lines {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: calc(100% / 12) 100%;
    max-width: 1480px;
    margin: 0 auto;
    padding: 0 32px;
    opacity: 0.6;
  }
  [data-dividers="off"] .grid-lines { display: none; }
  [data-dividers="off"] .section-divider { display: none; }

  /* ── Top Nav ─────────────────────────────────────────────────────────── */
  .nav {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    background: rgba(3,20,32,0.78);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 64px;
    max-width: 1480px; margin: 0 auto; padding: 0 32px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    display: grid; place-items: center;
    color: var(--bg); font-weight: 700; font-family: var(--font-mono);
    font-size: 13px; letter-spacing: -0.04em;
  }
  .brand-name { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
  .brand-sub { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); letter-spacing: 0.12em; text-transform: uppercase; }

  .nav-links { display: flex; align-items: center; gap: 4px; }
  .nav-link {
    padding: 8px 14px; font-size: 13px; color: var(--text-dim);
    border-radius: 6px; transition: color .15s, background .15s;
  }
  .nav-link:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .nav-link.active { color: var(--accent); }

  .nav-meta { display: flex; align-items: center; gap: 16px; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); box-shadow: 0 0 12px var(--good); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  /* ── Hero ────────────────────────────────────────────────────────────── */
  .hero { position: relative; padding: 64px 0 48px; }
  .hero-tag { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .hero-tag-line { flex: 1; height: 1px; background: linear-gradient(to right, var(--line-2), transparent); max-width: 120px; }
  .hero-title {
    font-family: var(--font-display);
    font-size: clamp(48px, 7vw, 92px);
    line-height: 0.96;
    letter-spacing: -0.04em;
    font-weight: 500;
    margin: 0 0 24px;
    max-width: 14ch;
  }
  .hero-title em {
    font-style: normal;
    color: var(--accent);
    font-weight: 400;
  }
  [data-font="editorial"] .hero-title em { font-style: italic; }
  .hero-sub {
    font-size: 17px; line-height: 1.55; color: var(--text-dim);
    max-width: 56ch;
  }
  .hero-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: end;
    margin-top: 40px;
  }
  .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 20px; border-radius: 8px;
    font-size: 13px; font-weight: 500;
    transition: transform .15s, background .15s, border-color .15s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary {
    background: var(--accent); color: var(--bg);
  }
  .btn-primary:hover { background: #5fe6d4; }
  .btn-ghost {
    border: 1px solid var(--line-2); color: var(--text);
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.04); border-color: var(--accent); }
  .arrow { display: inline-block; width: 14px; height: 14px; position: relative; }
  .arrow::before, .arrow::after { content: ""; position: absolute; background: currentColor; }
  .arrow::before { right: 0; top: 50%; width: 12px; height: 1.5px; transform: translateY(-50%); }
  .arrow::after { right: 0; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-top: 1.5px solid currentColor; transform: translateY(-50%) rotate(45deg); background: none; }

  /* ── Stats strip ─────────────────────────────────────────────────────── */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-top: 48px;
  }
  .stat {
    padding: 28px 24px;
    border-right: 1px solid var(--line);
    position: relative;
  }
  .stat:last-child { border-right: 0; }
  .stat-value { font-family: var(--font-mono); font-size: 32px; font-weight: 500; letter-spacing: -0.02em; color: var(--text); }
  .stat-unit { font-family: var(--font-mono); font-size: 13px; color: var(--text-faint); margin-left: 4px; }
  .stat-label { margin-top: 4px; }
  .stat-delta { position: absolute; top: 28px; right: 24px; font-family: var(--font-mono); font-size: 11px; color: var(--accent); }

  /* ── Sections ────────────────────────────────────────────────────────── */
  .section { padding: var(--section-gap) 0 0; position: relative; }
  .section-head {
    display: grid; grid-template-columns: auto 1fr auto; align-items: end;
    gap: 24px; margin-bottom: 28px;
  }
  .section-num {
    font-family: var(--font-mono); font-size: 11px; color: var(--accent);
    letter-spacing: 0.14em;
  }
  .section-title {
    font-family: var(--font-display);
    font-size: 32px; font-weight: 500; letter-spacing: -0.02em;
    margin: 0;
  }
  .section-divider { height: 1px; background: var(--line); }

  /* ── About + Mission ─────────────────────────────────────────────────── */
  .about-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; }
  @media (max-width: 900px) { .about-grid { grid-template-columns: 1fr; } }

  .card {
    background: linear-gradient(180deg, rgba(8,42,61,0.5) 0%, rgba(6,31,46,0.6) 100%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: var(--card-pad);
    position: relative;
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px dashed var(--line);
  }
  .card-head-l { display: flex; align-items: center; gap: 10px; }
  .card-head h3 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
  .card-head .label { font-size: 10px; }
  .card-id { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }

  .about-card p {
    font-size: 13.5px; line-height: 1.7; color: var(--text-dim);
    margin: 0 0 14px;
  }
  .about-card p:last-child { margin-bottom: 0; }
  .about-card strong { color: var(--text); font-weight: 500; }

  .mission-list { list-style: none; padding: 0; margin: 0; }
  .mission-list li {
    display: grid; grid-template-columns: 28px 1fr; gap: 14px;
    padding: 14px 0;
    border-bottom: 1px dashed var(--line);
    align-items: start;
    font-size: 13px; line-height: 1.55; color: var(--text-dim);
  }
  .mission-list li:last-child { border-bottom: 0; padding-bottom: 0; }
  .mission-num { font-family: var(--font-mono); font-size: 11px; color: var(--accent); padding-top: 2px; }
  .mission-list b { display: block; color: var(--text); font-weight: 500; margin-bottom: 2px; font-size: 13.5px; }

  /* ── Geodatabase gallery ─────────────────────────────────────────────── */
  .geo-card { padding: 0; overflow: hidden; }
  .geo-head { padding: var(--card-pad); border-bottom: 1px dashed var(--line); display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; }
  .geo-head h3 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
  .geo-head p { margin: 4px 0 0; color: var(--text-dim); font-size: 13px; }
  .geo-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 1px; background: var(--line);
  }
  .geo-tile {
    position: relative; aspect-ratio: 4/3; overflow: hidden;
    background: var(--panel);
    cursor: pointer; transition: transform .3s;
  }
  .geo-tile:hover { z-index: 2; }
  .geo-tile-bg { position: absolute; inset: 0; }
  .geo-tile-img {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    transition: transform .6s, filter .3s;
    filter: saturate(0.85) brightness(0.85);
  }
  .geo-tile:hover .geo-tile-img { transform: scale(1.05); filter: saturate(1) brightness(1); }
  .geo-tile-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(3,20,32,0.85) 100%);
  }
  .geo-tile-meta {
    position: absolute; left: 14px; right: 14px; bottom: 12px;
    color: var(--text);
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .geo-tile-meta h4 { margin: 0; font-size: 14px; font-weight: 500; letter-spacing: -0.01em; }
  .geo-tile-meta .label { color: var(--accent); font-size: 9px; }
  .geo-tile-coord { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); }
  @media (max-width: 900px) { .geo-grid { grid-template-columns: repeat(2, 1fr); } }

  /* ── Projects ────────────────────────────────────────────────────────── */
  .projects-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
  }
  @media (max-width: 1100px) { .projects-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 720px) { .projects-grid { grid-template-columns: 1fr; } }

  .project {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    transition: transform .25s, border-color .25s, box-shadow .25s;
    display: flex; flex-direction: column;
    cursor: pointer;
  }
  .project:hover {
    transform: translateY(-3px);
    border-color: var(--accent-2);
    box-shadow: 0 12px 32px -12px rgba(0,0,0,0.6), 0 0 0 1px rgba(74,214,196,0.18);
  }
  .project-img {
    aspect-ratio: 16/10;
    background-size: cover; background-position: center;
    position: relative;
    border-bottom: 1px solid var(--line);
  }
  .project-img::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(3,20,32,0.7) 100%);
  }
  .project-status {
    position: absolute; top: 12px; left: 12px; z-index: 2;
    background: rgba(3,20,32,0.7); backdrop-filter: blur(6px);
    padding: 4px 8px; border-radius: 4px;
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em;
    color: var(--accent);
    display: flex; align-items: center; gap: 6px;
  }
  .project-status .dot { width: 5px; height: 5px; }
  .project-id {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);
    background: rgba(3,20,32,0.6); backdrop-filter: blur(6px);
    padding: 4px 8px; border-radius: 4px;
  }
  .project-body { padding: 18px 20px; flex: 1; display: flex; flex-direction: column; }
  .project-title { font-size: 17px; font-weight: 500; letter-spacing: -0.01em; margin: 0 0 6px; }
  .project-desc { font-size: 12.5px; color: var(--text-dim); line-height: 1.55; margin: 0 0 14px; flex: 1; }
  .project-foot {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 14px; border-top: 1px dashed var(--line);
    font-family: var(--font-mono); font-size: 10px;
    color: var(--text-faint);
  }
  .project-coord { color: var(--text); }
  .project-arrow {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--line-2);
    display: grid; place-items: center;
    transition: background .2s, color .2s, border-color .2s;
  }
  .project:hover .project-arrow { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  /* ── Team ────────────────────────────────────────────────────────────── */
  .team-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .team-grid.admins { grid-template-columns: repeat(2, 1fr); max-width: 720px; }
  @media (max-width: 1000px) { .team-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .team-grid, .team-grid.admins { grid-template-columns: 1fr; } }

  .member {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
    transition: transform .25s, border-color .25s, box-shadow .25s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .member:hover {
    transform: translateY(-2px);
    border-color: var(--accent-2);
    box-shadow: 0 10px 28px -10px rgba(0,0,0,0.6);
  }
  .member::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(to right, transparent, var(--accent), transparent);
    opacity: 0; transition: opacity .3s;
  }
  .member:hover::before { opacity: 1; }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%;
    display: grid; place-items: center;
    font-family: var(--font-mono); font-weight: 600; font-size: 18px;
    color: var(--bg);
    margin-bottom: 16px;
    position: relative;
  }
  .avatar::after {
    content: ""; position: absolute; bottom: 0; right: 0;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--good); border: 2px solid var(--panel);
  }
  .member-name { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; margin: 0 0 4px; }
  .member-role { font-size: 12px; color: var(--text-dim); margin: 0 0 14px; line-height: 1.4; }
  .member-meta {
    display: flex; justify-content: space-between;
    padding-top: 12px; border-top: 1px dashed var(--line);
    font-family: var(--font-mono); font-size: 10px; color: var(--text-faint);
    letter-spacing: 0.06em;
  }
  .member-meta .label-accent { color: var(--accent); }

  /* admin variant */
  .admins .member { padding: 28px; }
  .admins .avatar { width: 64px; height: 64px; font-size: 20px; }
  .admins .member-name { font-size: 17px; }
  .admins .member-role { font-size: 13px; }
  .admin-badge {
    position: absolute; top: 18px; right: 18px;
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.16em;
    color: var(--warn); padding: 3px 8px;
    border: 1px solid rgba(245,185,74,0.4);
    border-radius: 4px;
  }

  /* ── Footer ──────────────────────────────────────────────────────────── */
  footer {
    margin-top: 120px;
    padding: 32px 0;
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-mono); font-size: 11px; color: var(--text-faint);
  }

  /* ── Modal ───────────────────────────────────────────────────────────── */
  .modal-back {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(3,20,32,0.7);
    backdrop-filter: blur(6px);
    display: grid; place-items: center;
    padding: 24px;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
    border: 1px solid var(--line-2);
    border-radius: 12px;
    width: 100%; max-width: 520px;
    padding: 32px;
    position: relative;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.8);
    animation: slideUp .25s ease;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .modal-close {
    position: absolute; top: 16px; right: 16px;
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--line);
    display: grid; place-items: center;
    color: var(--text-dim);
    transition: background .15s, color .15s;
  }
  .modal-close:hover { background: var(--line); color: var(--text); }
  .modal-head { display: flex; gap: 18px; align-items: center; margin-bottom: 24px; }
  .modal .avatar { margin: 0; width: 72px; height: 72px; font-size: 22px; }
  .modal-name { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; margin: 0; }
  .modal-role { color: var(--text-dim); font-size: 14px; margin: 4px 0 0; }
  .modal-stats {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .modal-stat { background: var(--panel); padding: 16px; }
  .modal-stat-v { font-family: var(--font-mono); font-size: 20px; color: var(--text); font-weight: 500; }
  .modal-bio { font-size: 13.5px; line-height: 1.6; color: var(--text-dim); margin: 0 0 20px; }
  .modal-foot { display: flex; gap: 8px; }
  .modal-tag {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em;
    padding: 5px 10px; border: 1px solid var(--line-2); border-radius: 4px;
    color: var(--text-dim);
  }

  /* ── Entrance animations ─────────────────────────────────────────────── */
  .fade-up { opacity: 0; transform: translateY(16px); transition: opacity .7s ease, transform .7s ease; }
  .fade-up.in { opacity: 1; transform: none; }

  /* small icon system: square 14×14 line drawings via CSS pseudo elements */
  .ico { width: 14px; height: 14px; display: inline-block; position: relative; flex-shrink: 0; }
  .ico-globe::before { content: ""; position: absolute; inset: 0; border: 1.3px solid currentColor; border-radius: 50%; }
  .ico-globe::after  { content: ""; position: absolute; inset: 0; border: 1.3px solid currentColor; border-radius: 50%; transform: scaleX(.45); }
  .ico-target::before { content: ""; position: absolute; inset: 0; border: 1.3px solid currentColor; border-radius: 50%; }
  .ico-target::after  { content: ""; position: absolute; inset: 4px; background: currentColor; border-radius: 50%; }
